<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VECTOR | Virtual Enhanced Cognitive Technology & Operational Response</title>
<style>
:root{--cyan:#45e8ff;--blue:#178cff;--bg:#050b16;--panel:rgba(8,25,45,.82);--muted:#8ba9c2}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 25%,#102c4c 0,#071426 36%,#030711 78%);color:#e8faff;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(69,232,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(69,232,255,.035) 1px,transparent 1px);background-size:38px 38px;mask-image:linear-gradient(to bottom,black,transparent)}
header{text-align:center;padding:32px 16px 8px}h1{font-size:clamp(42px,8vw,76px);letter-spacing:.22em;margin:0 0 8px;color:#eaffff;text-shadow:0 0 12px #45e8ff,0 0 34px #178cff;font-weight:800}.subtitle{font-size:12px;letter-spacing:.18em;color:#8fb9d1;text-transform:uppercase}
main{width:min(900px,92vw);margin:20px auto 50px}.status{display:flex;justify-content:center;align-items:center;gap:9px;color:#9bc4d8;font-size:12px;letter-spacing:.12em;margin:20px 0}.dot{width:8px;height:8px;border-radius:50%;background:#45ffb0;box-shadow:0 0 12px #45ffb0}
.core-wrap{display:flex;justify-content:center;margin:24px 0 30px}.core{width:190px;height:190px;border:1px solid rgba(69,232,255,.65);border-radius:50%;display:grid;place-items:center;position:relative;box-shadow:0 0 25px #178cff55,inset 0 0 25px #178cff44;animation:pulse 3s ease-in-out infinite}.core:before,.core:after{content:"";position:absolute;border:1px solid #45e8ff88;border-radius:50%;inset:12px;animation:spin 12s linear infinite}.core:after{inset:-10px;border-style:dashed;animation:spin 24s linear infinite reverse}.core span{font-size:25px;font-weight:bold;letter-spacing:.18em;color:#bafaff;text-shadow:0 0 14px #45e8ff}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{box-shadow:0 0 48px #178cff99,inset 0 0 35px #178cff77}}
.panel{background:var(--panel);border:1px solid #45e8ff55;border-radius:16px;box-shadow:0 0 30px #001a35;padding:20px;backdrop-filter:blur(10px)}
.panel-head{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #45e8ff33;padding-bottom:12px;margin-bottom:14px;color:#9cefff;font-size:12px;letter-spacing:.15em}
#messages{height:260px;overflow-y:auto;padding:4px 2px 12px;display:flex;flex-direction:column;gap:12px}.msg{max-width:88%;padding:12px 14px;border-radius:12px;line-height:1.5;font-size:14px;white-space:pre-wrap}.bot{align-self:flex-start;background:#0c2b45;border:1px solid #237ba0}.user{align-self:flex-end;background:#123f66;border:1px solid #248ec7}
.controls{display:flex;gap:9px;margin-top:12px}input{min-width:0;flex:1;background:#061321;border:1px solid #28708d;border-radius:10px;padding:14px;color:#eaffff;font-size:14px;outline:none}input:focus{border-color:var(--cyan);box-shadow:0 0 12px #45e8ff44}button{border:1px solid #45e8ff88;background:linear-gradient(135deg,#0e5b82,#123d70);color:#eaffff;border-radius:10px;padding:0 16px;font-weight:bold;cursor:pointer}button:hover{filter:brightness(1.25)}button:active{transform:scale(.98)}.small-buttons{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.small-buttons button{padding:9px 12px;font-size:12px;background:#091c30}
footer{text-align:center;color:#63859d;font-size:11px;letter-spacing:.12em;margin-top:18px}
@media(max-width:560px){.controls{flex-wrap:wrap}.controls input{flex-basis:100%}.controls button{min-height:42px;flex:1}.core{width:155px;height:155px}#messages{height:300px}}
</style>
</head>
<body>
<header><h1>VECTOR</h1><div class="subtitle">Virtual Enhanced Cognitive Technology &amp; Operational Response</div></header>
<main>
<div class="status"><span class="dot"></span><span>SYSTEM ONLINE</span><span>•</span><span id="clock">--:--:--</span></div>
<div class="core-wrap"><div class="core"><span>V</span></div></div>
<section class="panel">
 <div class="panel-head"><span>VECTOR INTERFACE</span><span id="state">READY</span></div>
 <div id="messages" aria-live="polite"><div class="msg bot">Hello! I am VECTOR. Ask me a question or try the microphone button.</div></div>
 <div class="controls">
  <input id="question" type="text" placeholder="Ask VECTOR something..." autocomplete="off">
  <button id="send">SEND</button>
  <button id="mic" title="Use microphone">🎙</button>
 </div>
 <div class="small-buttons"><button id="time">TIME</button><button id="date">DATE</button><button id="clear">CLEAR CHAT</button><button id="voice">VOICE: ON</button></div>
</section>
<footer>VECTOR • LOCAL BROWSER ASSISTANT • VERSION 1.0</footer>
</main>
<script>
const $=id=>document.getElementById(id), messages=$("messages");
let voiceOn=true;
function add(text,who="bot"){const d=document.createElement("div");d.className="msg "+who;d.textContent=text;messages.appendChild(d);messages.scrollTop=messages.scrollHeight;}
function say(text){if(voiceOn&&"speechSynthesis"in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=1; speechSynthesis.speak(u);}}
function answer(q){
 const s=q.toLowerCase().trim();
 if(!s)return "Please type a question.";
 if(/\b(hi|hello|hey)\b/.test(s))return "Hello! VECTOR is online. What would you like to know?";
 if(s.includes("your name")||s==="who are you")return "I am VECTOR: Virtual Enhanced Cognitive Technology & Operational Response.";
 if(s.includes("full form")&&s.includes("vector"))return "VECTOR stands for Virtual Enhanced Cognitive Technology & Operational Response.";
 if(s.includes("time"))return "The current time is "+new Date().toLocaleTimeString();
 if(s.includes("date")||s.includes("day today"))return "Today is "+new Date().toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"})+".";
 if(s.includes("capital of india"))return "The capital of India is New Delhi.";
 if(s.includes("largest planet"))return "Jupiter is the largest planet in our Solar System.";
 if(s.includes("speed")&&s.includes("formula"))return "Speed = Distance ÷ Time.";
 if(s.includes("light intensity"))return "Light intensity is commonly measured in candela (cd). Illuminance, the light falling on a surface, is measured in lux (lx).";
 if(s.includes("thank"))return "You're welcome. VECTOR is ready for your next question.";
 if(s.includes("help"))return "Try asking about my name, the time, date, India's capital, planets, speed formula, or light intensity.";
 const arithmetic=s.match(/^\s*(-?\d+(?:\.\d+)?)\s*([+\-*/])\s*(-?\d+(?:\.\d+)?)\s*$/);
 if(arithmetic){const a=Number(arithmetic[1]),b=Number(arithmetic[3]),op=arithmetic[2];if(op==="/"&&b===0)return "Division by zero is not allowed.";return "The answer is "+({"+":a+b,"-":a-b,"*":a*b,"/":a/b}[op])+".";}
 return "I don't have that answer in my starter offline knowledge yet. Try another question, or add more answers to VECTOR's knowledge base in the website code.";
}
function send(){const q=$("question").value.trim();if(!q)return;add(q,"user");$("question").value="";$("state").textContent="THINKING";const a=answer(q);add(a);say(a);$("state").textContent="READY";}
$("send").addEventListener("click",send);$("question").addEventListener("keydown",e=>{if(e.key==="Enter")send();});
$("time").onclick=()=>{const a="The current time is "+new Date().toLocaleTimeString();add(a);say(a);};
$("date").onclick=()=>{const a="Today is "+new Date().toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"});add(a);say(a);};
$("clear").onclick=()=>{messages.innerHTML="";add("Chat cleared. VECTOR is ready.");};
$("voice").onclick=()=>{voiceOn=!voiceOn;$("voice").textContent="VOICE: "+(voiceOn?"ON":"OFF");if(!voiceOn&&"speechSynthesis"in window)speechSynthesis.cancel();};
$("mic").onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){add("Speech recognition is not available in this browser. Try Chrome, or type your question.");return;}const r=new SR();r.lang="en-IN";r.onstart=()=>{$("state").textContent="LISTENING";};r.onresult=e=>{$("question").value=e.results[0][0].transcript;send();};r.onerror=()=>add("I couldn't hear that clearly. Please try again or type your question.");r.onend=()=>{$("state").textContent="READY";};r.start();};
function tick(){$("clock").textContent=new Date().toLocaleTimeString();}tick();setInterval(tick,1000);
</script>
</body></html>
